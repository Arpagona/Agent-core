name: Rust

on:
  push:
  pull_request:

jobs:
  test:
    name: Format, check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check workspace
        run: cargo check

      - name: Run tests
        run: cargo test
