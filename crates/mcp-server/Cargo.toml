[package]
name = "arpagona-mcp-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Alpha native MCP (Model Context Protocol) server for ARPAGONA Agent Core"

[dependencies]
arpagona-agent-core = { path = "../core" }
arpagona-tool-registry = { path = "../tool-registry" }
arpagona-decision-gate = { path = "../decision-gate" }
arpagona-tool-runtime = { path = "../tool-runtime" }
axum = { workspace = true }
chrono.workspace = true
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"
