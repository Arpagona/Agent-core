[workspace]
members = [
    "apps/api-server",
    "crates/core",
    "crates/graph-memory"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Proprietary"
authors = ["ARPAGONA"]

[workspace.dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
