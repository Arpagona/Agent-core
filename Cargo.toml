[workspace]
members = [
    "crates/core"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Proprietary"
authors = ["ARPAGONA"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
