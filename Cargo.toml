[workspace]
members = [
    "apps/api-server",
    "crates/cli",
    "crates/compute-reservoir",
    "crates/conversation-memory",
    "crates/core",
    "crates/decision-gate",
    "crates/graph-memory",
    "crates/holographic-memory",
    "crates/llm",
    "crates/runtime",
    "crates/tool-registry",
    "crates/tool-runtime",
    "crates/mcp-server",
    "crates/compressed-cognitive-attention",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Proprietary"
authors = ["ARPAGONA"]

[workspace.dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
