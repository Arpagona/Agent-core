[workspace]
members = [
    "apps/api-server",
    "crates/cli",
    "crates/compute-reservoir",
    "crates/core",
    "crates/decision-gate",
    "crates/graph-memory",
    "crates/llm",
    "crates/runtime",
    "crates/tool-registry",
    "crates/tool-runtime",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Proprietary"
authors = ["ARPAGONA"]

[workspace.dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
